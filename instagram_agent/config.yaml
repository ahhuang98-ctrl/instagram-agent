schedule:
  mode: interval        # "cron" or "interval"
  cron:
    hour: "9"           # 9 AM daily
    minute: "0"
    timezone: "America/New_York"
  interval:
    minutes: 1          # used only when mode: interval

posting:
  post_feed: true

image:
  generator: "dreamina_browser"   # "dreamina_browser" | "leonardo" | "fal"
  size_preset: "square_hd"        # used only when generator=fal
  enhance_prompt: true             # used only when generator=fal
  num_images: 1

prompts:
  selection: random    # "random" or "sequential"
  feed:
    - image_prompt: "A breathtaking sunrise over misty mountain peaks, cinematic photography, golden hour, 8K"
      caption: "Every morning is a new beginning. #sunrise #nature #photography"
    - image_prompt: "Neon-lit Tokyo street at night, rain reflections on asphalt, cyberpunk aesthetic, ultra-detailed"
      caption: "City lights never sleep. #tokyo #nightphotography #urban"
    - image_prompt: "Tranquil Zen garden with raked sand patterns, soft diffused light, minimalist, macro"
      caption: "Find your stillness. #zen #mindfulness #peaceful"

imgbb:
  expiration: 0   # 0 = permanent; or seconds until auto-delete (max 15552000)
